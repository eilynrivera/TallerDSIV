# Perfil evil: sitio atacante (C5) en 127.0.0.1:4000.
# Sirve static-evil/ y NO carga Seed (los runners de datos estan gated a
# vulnerable/patched). Es un sitio aparte de la tienda, a proposito, para que
# Chrome lo trate como otro origen (clave para M4 CORS y M5 CSRF).
server.port=4000
spring.web.resources.static-locations=classpath:/static-evil/

# El atacante no necesita la base de la tienda.
spring.jpa.hibernate.ddl-auto=none
