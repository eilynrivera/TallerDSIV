spring.application.name=owasp

# Comun a los tres perfiles: escuchar solo en loopback para no exponer
# una aplicacion vulnerable a la red del aula.
server.address=127.0.0.1

# Base H2 en memoria con nombre e identidad fijos, para que la consola H2 se
# conecte siempre con el mismo JDBC URL (jdbc:h2:mem:tienda), usuario sa y sin
# contrasena. DB_CLOSE_DELAY=-1 la mantiene viva mientras corre el servidor.
# Cada perfil es un proceso aparte, asi que no comparten datos aunque usen el mismo nombre.
spring.datasource.url=jdbc:h2:mem:tienda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Base H2 en memoria que se recrea al arrancar: reiniciar el servidor = restaurar.
spring.jpa.hibernate.ddl-auto=create-drop

# Consola H2 desactivada por defecto; cada perfil decide si la activa (la usa M2).
spring.h2.console.enabled=false
