# NOTA (adaptacion a la convencion del plan - Jose/Persona C):
# archivo renombrado de application-corregido.properties a
# application-patched.properties (el perfil seguro del plan se llama "patched").
# Perfil patched (C2 - Jose/Persona C)
server.port=3001
server.servlet.session.cookie.name=sid_safe
spring.web.resources.static-locations=classpath:/static-patched/

# Consola H2 para verificar las contraseñas protegidas (M2 - B)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# M3 capa 3 (A): cookie HttpOnly; aunque se colara un script, no puede leer sid_safe.
# (Es el valor por defecto de Spring Boot; se deja explicito para la clase.)
server.servlet.session.cookie.http-only=true

# M5 (C9): SameSite=Lax (lo contrario de la version vulnerable). El navegador NO
# envia la cookie en un POST desde otro sitio, asi que el CSRF de premio.html falla.
server.servlet.session.cookie.same-site=lax
