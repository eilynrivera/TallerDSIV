# Perfil vulnerable (C2 - Jose/Persona C)
server.port=3000
server.servlet.session.cookie.name=sid_vuln
spring.web.resources.static-locations=classpath:/static-vulnerable/

# Consola H2 para la demostración vulnerable (M2 - B)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# M3 (A): cookie de sesion legible desde JavaScript, a proposito, para que
# <img src=x onerror=alert(document.cookie)> muestre sid_vuln.
server.servlet.session.cookie.http-only=false

# M4 (C6): SameSite=None para que el navegador envie la cookie en peticiones
# desde otro sitio (el atacante en 127.0.0.1:4000). Chrome exige Secure junto con
# SameSite=None; sobre http funciona porque trata localhost como contexto seguro.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
